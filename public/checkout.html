<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Picaso</title>
    <meta name="description" content="Complete your Picaso order." />

    <link rel="stylesheet" href="/css/checkout.css" />

<body>
    <main class="container checkout-page">

        <div class="checkout-head">
            <p class="eyebrow">Checkout</p>
            <h1>Complete your order</h1>
        </div>

        <div class="checkout-empty" id="checkout-empty" hidden>
            <p>Your cart is empty.</p>
            <a href="/shop.html" class="btn btn-primary">Go to shop</a>
        </div>

        <div class="checkout-layout" id="checkout-layout" hidden>

            <form class="checkout-form" id="checkout-form" novalidate>
                <h2>Delivery details</h2>

                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" type="text" autocomplete="name" maxlength="80" />
                    <p class="field-error" id="err-name"></p>
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20"
                        placeholder="01XXXXXXXXX" />
                    <p class="field-error" id="err-phone"></p>
                </div>

                <div class="field">
                    <label for="address">Full address</label>
                    <textarea id="address" name="address" rows="3" maxlength="300"></textarea>
                    <p class="field-error" id="err-address"></p>
                </div>

                <fieldset class="area-group">
                    <legend>Delivery area</legend>
                    <label class="area-option">
                        <input type="radio" name="area" value="inside" checked />
                        Inside Dhaka
                    </label>
                    <label class="area-option">
                        <input type="radio" name="area" value="outside" />
                        Outside Dhaka
                    </label>
                </fieldset>

                <p class="form-message" id="form-message" role="status"></p>

                <button type="submit" class="btn btn-primary btn-block place-order" id="place-order">Place
                    order</button>
            </form>

            <aside class="order-summary">
                <h2>Your order</h2>

                <div id="summary-items">
                    <div class="checkout-loading">Updating...</div>
                </div>

                <div class="upsell-box" id="upsell-box" hidden></div>

                <div class="summary-totals">
                    <div class="summary-line"><span>Subtotal</span><strong id="sum-subtotal">0 Tk</strong></div>
                    <div class="summary-line"><span>Delivery</span><strong id="sum-delivery">0 Tk</strong></div>
                    <div class="summary-line summary-total"><span>Total</span><strong id="sum-total">0 Tk</strong></div>
                    <p class="delivery-note" id="delivery-note"></p>
                </div>
            </aside>

        </div>
    </main>

    <script src="/js/tracking.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/checkout.js"></script>
</body>

</html>
