<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin login | Picaso</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
</head>

<body class="admin-body">
    <div class="login-wrap">
        <div class="login-card">
            <h1>Picaso Admin</h1>
            <p class="login-sub">Log in to manage products, orders and settings.</p>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" autocomplete="username" required />
                </div>

                <div class="field">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" required />
                </div>

                <p class="form-message" id="login-message" role="status"></p>

                <button type="submit" class="btn btn-primary" id="login-button">Log in</button>
            </form>
        </div>
    </div>

    <script src="/admin/js/login.js"></script>
</body>

</html>
