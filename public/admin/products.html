<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Products | Picaso Admin</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
    <link rel="stylesheet" href="/admin/css/products.css" />
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>

        <div class="admin-main">
            <div class="page-head">
                <h1>Products</h1>
                <button type="button" class="btn btn-primary" id="new-product-button">Add product</button>
            </div>

            <p class="page-intro">Add, edit or delete products. Changes are saved to the database and the shop updates
                right away.</p>

            <p class="form-message" id="page-message" role="status"></p>

            <section id="new-product-wrap" hidden>
                <div id="new-product-slot"></div>
            </section>

            <div id="product-list"></div>
        </div>
    </div>

    <script src="/admin/js/admin-layout.js"></script>
    <script src="/admin/js/products.js"></script>
</body>

</html>
